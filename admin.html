<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Predict Today</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#0a0a0a;color:#fff;padding:15px;max-width:600px;margin:auto}
h2{color:#00ff66;text-align:center;margin:15px 0}
.card{background:#151515;padding:14px;border-radius:12px;margin-bottom:12px;border:1px solid #222}
label{font-size:13px;color:#aaa;display:block;margin:4px 0}
input{width:100%;padding:13px;margin:6px 0;background:#000;border:1px solid #333;color:#fff;border-radius:8px}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
button{width:100%;padding:15px;font-weight:900;border:none;border-radius:10px;margin-top:10px;cursor:pointer}
.btn-green{background:#00ff66;color:#000}
.btn-red{background:#ff0033;color:#fff;margin-top:20px;font-size:16px}
.status{margin-top:15px;text-align:center;font-weight:800;padding:12px;border-radius:8px;display:none}
</style>
</head>
<body>
<h2>⚙️ Predict Today Admin</h2>

<div class="card">
<label>Booking Code (e.g 83AKK92) - This one go show for main site</label>
<input id="code" placeholder="Enter booking code e.g 83AKK92">
</div>

<div id="games"></div>

<button class="btn-red" onclick="publish()">🚀 PUBLISH 8 GAMES TO LIVE SITE</button>
<div id="status" class="status"></div>

<script>
const SUPABASE_URL = "https://qsusnekkdlygkebedupb.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_zrTE8rC6xJN7vt9qw_phTA_BqKC3EQW";
const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let gameCount = 0;

function addGame(){
 if(gameCount>=8){alert("Max 8 games");return;}
 gameCount++;
 const div=document.createElement('div');div.className='card';
 div.innerHTML=`<label>Game ${gameCount}</label><div class="row">
 <input placeholder="Home" class="home">
 <input placeholder="Away" class="away">
 <input placeholder="Tip e.g Over 1.5" class="tip"></div>
 <input placeholder="League e.g Premier League" class="league">`;
 document.getElementById('games').appendChild(div);
}

async function publish(){
 const cards=document.querySelectorAll('#games .card');
 let games=[];
 cards.forEach(c=>{games.push({home:c.querySelector('.home').value, away:c.querySelector('.away').value, tip:c.querySelector('.tip').value, league:c.querySelector('.league').value});});
 const code=document.getElementById('code').value;
 if(!code){alert("Enter booking code first");return;}
 if(games.length!==8){alert("Add 8 games - you have "+games.length);return;}
 for(let g of games){if(!g.home||!g.away||!g.tip){alert("Fill all games complete");return;}}
 document.getElementById('status').style.display='block';
 document.getElementById('status').innerText="⏳ Publishing...";
 document.getElementById('status').style.background="#333";
 const {error}=await supa.from('predictions').insert({games:games, booking_code:code});
 if(error){
  document.getElementById('status').innerText="❌ "+error.message;
  document.getElementById('status').style.background="#ff0033";
 } else {
  document.getElementById('status').innerText="✅ SUCCESS! 8 Games live now! Go check main site.";
  document.getElementById('status').style.background="#00ff66";
  document.getElementById('status').style.color="#000";
 }
}

for(let i=0;i<8;i++) addGame();
</script>
</body>
</html>
