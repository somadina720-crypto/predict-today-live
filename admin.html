<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Admin - Predict Today</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#0a0a0a;color:#fff;padding:15px;max-width:650px;margin:auto}
h2{color:#00ff66;text-align:center}
.card{background:#151515;padding:14px;border-radius:12px;margin-bottom:12px;border:1px solid #222}
label{font-size:13px;color:#aaa;display:block;margin:5px 0}
input{width:100%;padding:13px;margin:6px 0;background:#000;border:1px solid #333;color:#fff;border-radius:8px}
input:disabled{background:#1a1a1a;color:#888;border:1px dashed #333}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
button{width:100%;padding:15px;font-weight:900;border:none;border-radius:10px;margin-top:10px;cursor:pointer;font-size:15px}
.btn-green{background:#00ff66;color:#000}
.btn-red{background:#ff0033;color:#fff}
.btn-orange{background:#ff8800;color:#000}
.btn-grey{background:#222;color:#fff;border:1px solid #333}
.status{margin-top:15px;text-align:center;font-weight:800;padding:12px;border-radius:8px;display:none}
#preview{width:100%;max-height:350px;object-fit:contain;border-radius:10px;display:none;margin-top:10px;border:1px solid #333}
small{color:#777}
.tipInput{border:1px solid #00ff66!important;background:#001a00!important;color:#00ff66!important;font-weight:900}
</style>
</head>
<body>
<h2>⚙️ SUPER ADMIN</h2>

<div class="card">
<label>📸 STEP 1: Upload Screenshot of your 8 games</label>
<input type="file" id="screenshot" accept="image/*">
<img id="preview"/>
<small id="ocrStatus" style="color:#00ff66;font-weight:700"></small>
</div>

<div class="card">
<label>🎫 Booking Code (auto-detected)</label>
<input id="code" placeholder="e.g T2VAKQ">
</div>

<div id="games"></div>

<button class="btn-grey" onclick="clearAllFields()">🧹 Clear Form</button>
<button class="btn-orange" onclick="deletePrevious()">🗑️ DELETE PREVIOUS PUBLISH</button>
<button class="btn-red" onclick="publish()">🚀 PUBLISH 8 GAMES TO LIVE SITE</button>
<div id="status" class="status"></div>

<script>
const SUPABASE_URL="https://qsusnekkdlygkebedupb.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_zrTE8rC6xJN7vt9qw_phTA_BqKC3EQW";
const supa=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let gameCount=0;

function addGame(d={home:'',away:'',tip:'',league:'', locked:false}){
 if(gameCount>=8) return;
 gameCount++;
 const div=document.createElement('div');div.className='card';
 const disabled = d.locked? 'disabled' : '';
 const tipClass = d.locked? 'tip tipInput' : 'tip';
 div.innerHTML=`<label>Game ${gameCount} ${d.locked? '🔒 Locked teams - Only edit TIP' : ''}</label>
 <div class="row">
 <input placeholder="Home" class="home" value="${d.home}" ${disabled}>
 <input placeholder="Away" class="away" value="${d.away}" ${disabled}>
 <input placeholder="TIP ONLY - You can edit" class="${tipClass}" value="${d.tip}">
 </div>
 <input placeholder="League" class="league" value="${d.league}" ${disabled}>`;
 document.getElementById('games').appendChild(div);
}
function clearAllFields(){
 document.getElementById('games').innerHTML='';gameCount=0;
 for(let i=0;i<8;i++) addGame();
 document.getElementById('code').value='';
}
for(let i=0;i<8;i++) addGame();

document.getElementById('screenshot').addEventListener('change', async (e)=>{
 const file=e.target.files[0]; if(!file) return;
 const img=document.getElementById('preview'); img.src=URL.createObjectURL(file); img.style.display='block';
 document.getElementById('ocrStatus').innerText='⏳ Reading teams + tips... wait 15 sec...';
 try{
  const {data:{text}} = await Tesseract.recognize(file,'eng');
  console.log(text);
  // FIND BOOKING CODE - like T2VAKQ, 6-7 chars capital
  let codeMatch = text.match(/\b[A-Z0-9]{5,8}\b/);
  if(codeMatch) document.getElementById('code').value = codeMatch[0];

  // NEW PARSER - extract lines that look like "Azerbaijan vs Liechtenstein" or contain tips
  let lines = text.split('\n').map(s=>s.trim()).filter(s=>s.length>2);
  let gamesFound = [];

  // Look for vs, -, or known teams
  for(let i=0;i<lines.length;i++){
    let line = lines[i];
    if(/vs|v\s|@/.test(line.toLowerCase()) && line.length < 60){
       let parts = line.split(/vs|v\s|@| - /i);
       if(parts.length>=2){
         let home = parts[0].replace(/[^a-zA-Z ]/g,'').trim().substring(0,20);
         let away = parts[1].replace(/[^a-zA-Z ]/g,'').trim().substring(0,20);
         // Next lines might have tip like 1, X, 2, Over, GG etc
         let tip = '';
         for(let j=i+1;j<Math.min(i+4, lines.length);j++){
            if(/^(1|X|2|GG|NG|Over|Under|1X|X2|12)/i.test(lines[j])){ tip=lines[j].substring(0,15); break; }
         }
         if(home && away) gamesFound.push({home, away, tip: tip || '1', league:'International'});
       }
    }
  }

  // Fallback: if not found 8, use generic split
  if(gamesFound.length < 4){
    gamesFound = [];
    let possible = lines.filter(l=> l.split(' ').length>=2 && l.length<40 &&!/odd|stake|sporty|total/i.test(l));
    for(let k=0;k<Math.min(8, possible.length);k++){
      gamesFound.push({home: possible[k].split(' ')[0] || 'Home', away: possible[k].split(' ')[1] || 'Away', tip: '1', league:''});
    }
  }

  document.getElementById('games').innerHTML=''; gameCount=0;
  gamesFound.slice(0,8).forEach(g=>{
    addGame({home:g.home, away:g.away, tip:g.tip, league:g.league, locked:true});
  });
  while(gameCount<8) addGame({home:'',away:'',tip:'',league:'', locked:false});

  document.getElementById('ocrStatus').innerText='✅ Read done! Teams are locked. ONLY edit the green TIP box if wrong.';
 }catch(err){
  document.getElementById('ocrStatus').innerText='❌ Could not read well, type manually but tips only editable.';
 }
});

async function deletePrevious(){
 if(!confirm("Delete all old games from users site?")) return;
 document.getElementById('status').style.display='block';
 document.getElementById('status').innerText='⏳ Deleting...';
 document.getElementById('status').style.background='#333';
 const {error} = await supa.from('predictions').delete().neq('id',0);
 if(error){
  document.getElementById('status').innerText='❌ '+error.message;
  document.getElementById('status').style.background='#ff0033';
 } else {
  document.getElementById('status').innerText='✅ DELETED! Users site now shows "No tips yet"';
  document.getElementById('status').style.background='#ff8800';
  document.getElementById('status').style.color='#000';
 }
}

async function publish(){
 const cards=document.querySelectorAll('#games.card');
 let games=[];
 // Skip first 2 cards (upload + code)
 let gameCards = Array.from(document.querySelectorAll('#games.card'));
 gameCards.forEach(c=>{
   let h=c.querySelector('.home'), a=c.querySelector('.away'), t=c.querySelector('.tip'), l=c.querySelector('.league');
   if(h && a && t) games.push({home:h.value, away:a.value, tip:t.value, league:l.value});
 });
 const code=document.getElementById('code').value;
 if(!code){alert("Enter booking code");return;}
 if(games.length!==8){alert("Need 8 games, you have "+games.length);return;}
 for(let g of games){if(!g.home||!g.away||!g.tip){alert("Fill home, away, tip for all 8");return;}}
 document.getElementById('status').style.display='block';
 document.getElementById('status').innerText='⏳ Publishing...';
 document.getElementById('status').style.background='#333';
 await supa.from('predictions').delete().neq('id',0);
 const {error}=await supa.from('predictions').insert({games:games, booking_code:code});
 if(error){
  document.getElementById('status').innerText='❌ '+error.message;
  document.getElementById('status').style.background='#ff0033';
 } else {
  document.getElementById('status').innerText='✅ SUCCESS! Live now!';
  document.getElementById('status').style.background='#00ff66';
  document.getElementById('status').style.color='#000';
 }
}
</script>
</body>
</html>
