<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Admin - Predict Today</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#0a0a0a;color:#fff;padding:15px;max-width:650px;margin:auto}
h2{color:#00ff66;text-align:center}
.card{background:#151515;padding:14px;border-radius:12px;margin-bottom:12px;border:1px solid #222}
label{font-size:13px;color:#aaa;display:block;margin:5px 0}
input{width:100%;padding:13px;margin:6px 0;background:#000;border:1px solid #333;color:#fff;border-radius:8px}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
button{width:100%;padding:15px;font-weight:900;border:none;border-radius:10px;margin-top:10px;cursor:pointer;font-size:15px}
.btn-grey{background:#222;color:#fff;border:1px solid #333}
.btn-orange{background:#ff8800;color:#000}
.btn-red{background:#ff0033;color:#fff}
.status{margin-top:15px;text-align:center;font-weight:800;padding:12px;border-radius:8px;display:none}
#preview{width:100%;max-height:350px;object-fit:contain;border-radius:10px;display:none;margin-top:10px;border:1px solid #333}
</style>
</head>
<body>
<h2>⚙️ SUPER ADMIN</h2>

<div class="card">
<label>📸 Upload Screenshot of your 8 games</label>
<input type="file" id="screenshot" accept="image/*">
<img id="preview"/>
<small id="ocrStatus" style="color:#00ff66;font-weight:700"></small>
</div>

<div class="card">
<label>🎫 Booking Code</label>
<input id="code" placeholder="e.g T2VAKQ">
</div>

<div id="games"></div>

<button class="btn-grey" onclick="clearAllFields()">🧹 Clear Form</button>
<button class="btn-orange" onclick="deletePrevious()">🗑️ DELETE PREVIOUS PUBLISH</button>
<button class="btn-red" onclick="publish()">🚀 PUBLISH 8 GAMES TO LIVE SITE</button>
<div id="status" class="status"></div>

<script>
const SUPABASE_URL="https://qsusnekkdlygkebedupb.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_zrTE8rC6xJN7vt9qw_phTA_BqKC3EQW";
const supa=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let gameCount=0;

function addGame(d={home:'',away:'',tip:'',league:''}){
 if(gameCount>=8) return;
 gameCount++;
 const div=document.createElement('div');div.className='card';
 div.innerHTML=`<label>Game ${gameCount}</label>
 <div class="row">
 <input placeholder="Home team" class="home" value="${d.home}">
 <input placeholder="Away team" class="away" value="${d.away}">
 <input placeholder="Tip - you can edit" class="tip" value="${d.tip}">
 </div>
 <input placeholder="League" class="league" value="${d.league}">`;
 document.getElementById('games').appendChild(div);
}
function clearAllFields(){
 document.getElementById('games').innerHTML='';gameCount=0;
 for(let i=0;i<8;i++) addGame();
 document.getElementById('code').value='';
}
for(let i=0;i<8;i++) addGame();

document.getElementById('screenshot').addEventListener('change', async (e)=>{
 const file=e.target.files[0]; if(!file) return;
 const img=document.getElementById('preview'); img.src=URL.createObjectURL(file); img.style.display='block';
 document.getElementById('ocrStatus').innerText='⏳ Reading teams + tips... wait...';
 try{
  const {data:{text}} = await Tesseract.recognize(file,'eng');
  let codeMatch = text.match(/\b[A-Z0-9]{5,8}\b/);
  if(codeMatch) document.getElementById('code').value = codeMatch[0];
  document.getElementById('ocrStatus').innerText='✅ Read done! You can edit anything before publishing.';
 }catch(err){
  document.getElementById('ocrStatus').innerText='❌ Could not read, type manually.';
 }
});

async function deletePrevious(){
 if(!confirm("Delete all old games?")) return;
 document.getElementById('status').style.display='block';
 document.getElementById('status').innerText='⏳ Deleting...';
 document.getElementById('status').style.background='#333';
 const {error} = await supa.from('predictions').delete().neq('id',0);
 if(error){
  document.getElementById('status').innerText='❌ '+error.message;
  document.getElementById('status').style.background='#ff0033';
 } else {
  document.getElementById('status').innerText='✅ DELETED! Users site now shows "No tips yet"';
  document.getElementById('status').style.background='#ff8800';
  document.getElementById('status').style.color='#000';
 }
}

async function publish(){
 let gameCards = document.querySelectorAll('#games.card');
 let games=[];
 gameCards.forEach(c=>{
   let h=c.querySelector('.home'), a=c.querySelector('.away'), t=c.querySelector('.tip'), l=c.querySelector('.league');
   if(h && a && t) games.push({home:h.value, away:a.value, tip:t.value, league:l.value});
 });
 const code=document.getElementById('code').value;
 if(!code){alert("Enter booking code");return;}
 if(games.length!==8){alert("Need 8 games, you have "+games.length);return;}
 for(let g of games){if(!g.home||!g.away||!g.tip){alert("Fill home, away, tip for all 8");return;}}
 document.getElementById('status').style.display='block';
 document.getElementById('status').innerText='⏳ Publishing...';
 document.getElementById('status').style.background='#333';
 await supa.from('predictions').delete().neq('id',0);
 const {error}=await supa.from('predictions').insert({games:games, booking_code:code});
 if(error){
  document.getElementById('status').innerText='❌ '+error.message;
  document.getElementById('status').style.background='#ff0033';
 } else {
  document.getElementById('status').innerText='✅ SUCCESS! 8 games LIVE now!';
  document.getElementById('status').style.background='#00ff66';
  document.getElementById('status').style.color='#000';
 }
}
</script>
</body>
</html>
